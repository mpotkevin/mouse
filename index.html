<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中風復健：左右控制訓練</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        #game-canvas {
            cursor: none;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        input[type=range] {
            height: 8px;
            border-radius: 5px;
            background: #e2e8f0;
            outline: none;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- 頂部資訊欄 -->
    <header id="game-header" class="p-4 flex justify-between items-center bg-white shadow-sm z-10">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-blue-600">左右平衡訓練</h1>
            <p class="text-gray-500 text-xs md:text-sm">水平移動滑鼠，接住落下的目標</p>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <div class="flex gap-2 md:gap-4 text-sm md:text-xl mr-2">
                <div class="font-semibold text-green-600 px-2 md:px-3 py-1 bg-green-50 rounded-lg">成功: <span id="score-display">0</span></div>
                <div class="font-semibold text-red-500 px-2 md:px-3 py-1 bg-red-50 rounded-lg">漏掉: <span id="miss-display">0</span></div>
            </div>
            
            <button id="pause-btn" class="px-3 py-2 bg-amber-500 text-white text-sm font-bold rounded-lg hover:bg-amber-600 transition">
                暫停
            </button>

            <button id="settings-btn" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0" />
                </svg>
            </button>
        </div>
    </header>

    <!-- 遊戲主區域 -->
    <main id="game-main" class="flex-grow flex items-center justify-center p-2 md:p-4 relative overflow-hidden">
        <canvas id="game-canvas"></canvas>

        <!-- 開始畫面 -->
        <div id="start-overlay" class="absolute inset-0 bg-white bg-opacity-95 flex flex-col items-center justify-center z-20 p-4">
            <div class="flex flex-col lg:flex-row gap-6 max-w-6xl w-full h-full lg:h-auto overflow-y-auto lg:overflow-visible p-2">
                <!-- 左側：開始介紹 -->
                <div class="flex-1 text-center lg:text-left p-6 md:p-8 bg-white rounded-3xl shadow-xl border border-gray-100">
                    <div class="mb-4 text-5xl">🎯</div>
                    <h2 class="text-2xl md:text-3xl font-bold mb-4">復健訓練準備</h2>
                    <p class="text-gray-600 mb-6 text-sm md:text-lg leading-relaxed">
                        透過移動滑鼠控制藍色滑桿，這能運動到您的肩部與前臂肌肉。目前的初始設定較為寬鬆，適合初步練習與適應。
                    </p>
                    <button id="start-btn" class="w-full py-4 bg-blue-600 text-white text-xl font-bold rounded-xl hover:bg-blue-700 transition shadow-lg active:scale-95 mb-4">
                        開始新訓練
                    </button>
                </div>

                <!-- 右側：歷史紀錄 -->
                <div class="flex-1 p-6 md:p-8 bg-gray-50 rounded-3xl shadow-inner border border-gray-200 flex flex-col max-h-[400px] lg:max-h-[500px]">
                    <h3 class="text-lg font-bold mb-4 text-gray-700 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        訓練歷史紀錄
                    </h3>
                    <div id="history-container" class="history-list overflow-y-auto space-y-3 pr-2">
                        <p class="text-gray-400 text-center py-10">尚無紀錄</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 暫停/成績詳細畫面 -->
        <div id="pause-overlay" class="hidden absolute inset-0 bg-blue-900 bg-opacity-40 backdrop-blur-sm flex flex-col items-center justify-center z-40 p-4">
            <div class="text-center p-6 md:p-8 bg-white rounded-3xl shadow-2xl max-w-md w-full animate-in fade-in zoom-in duration-300">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">訓練暫停中</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                        <p class="text-xs text-green-600 font-medium">成功接住</p>
                        <p id="pause-score" class="text-2xl md:text-3xl font-bold text-green-700">0</p>
                    </div>
                    <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                        <p class="text-xs text-red-600 font-medium">漏掉次數</p>
                        <p id="pause-miss" class="text-2xl md:text-3xl font-bold text-red-700">0</p>
                    </div>
                </div>

                <div class="space-y-2 mb-6">
                    <div class="flex justify-between items-center p-3 bg-blue-50 rounded-xl">
                        <span class="text-blue-700 text-sm font-medium">當前成功率</span>
                        <span id="accuracy-rate" class="text-lg font-bold text-blue-800">100%</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                        <span class="text-gray-600 text-sm font-medium">訓練時長</span>
                        <span id="training-duration" class="text-lg font-bold text-gray-800">00:00</span>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="resume-btn" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-md">
                        繼續訓練
                    </button>
                    <button id="finish-btn" class="w-full py-3 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition shadow-md">
                        儲存並結束這回合
                    </button>
                    <button id="quit-btn" class="w-full py-3 bg-white border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:bg-gray-50 transition">
                        放棄並回到主選單
                    </button>
                </div>
            </div>
        </div>

        <!-- 設定側欄 -->
        <div id="settings-panel" class="hidden absolute right-4 top-4 bottom-4 w-72 md:w-80 p-6 rounded-2xl shadow-2xl z-50 flex flex-col control-panel border border-white">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800">精確訓練參數</h3>
                <button id="close-settings" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>

            <div class="space-y-6 overflow-y-auto pr-2">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-gray-700">球體下落時間</label>
                        <span id="speed-val" class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-black rounded">8.0 秒</span>
                    </div>
                    <input type="range" id="speed-slider" min="1" max="15" step="0.5" value="8" class="w-full cursor-pointer">
                    <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                        <span>快 (1秒)</span>
                        <span>慢 (15秒)</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-gray-700">收集器寬度</label>
                        <span id="size-val" class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-black rounded">300 px</span>
                    </div>
                    <input type="range" id="size-slider" min="40" max="500" step="10" value="300" class="w-full cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-gray-700">球體生成間隔</label>
                        <span id="freq-val" class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-black rounded">3.0 秒</span>
                    </div>
                    <input type="range" id="freq-slider" min="0.5" max="8" step="0.5" value="3" class="w-full cursor-pointer">
                </div>

                <div>
                    <label class="flex items-center space-x-3 cursor-pointer p-2 bg-gray-50 rounded-lg">
                        <input type="checkbox" id="guide-lines" checked class="w-5 h-5 text-blue-600 rounded">
                        <span class="text-sm font-bold text-gray-700">顯示落點引導線</span>
                    </label>
                </div>
            </div>

            <div class="mt-auto pt-6 border-t">
                <button id="reset-history-btn" class="w-full py-3 border-2 border-red-200 text-red-500 font-bold rounded-xl hover:bg-red-50 transition">
                    清除歷史紀錄
                </button>
            </div>
        </div>
    </main>

    <footer id="game-footer" class="p-2 text-center text-gray-400 text-[10px] md:text-xs bg-white border-t">
        系統說明：畫布會根據您的設備自動調整大小。目前的初始參數已調至最易等級，減少挫折感。
    </footer>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const mainElement = document.getElementById('game-main');
        const scoreDisplay = document.getElementById('score-display');
        const missDisplay = document.getElementById('miss-display');
        const startBtn = document.getElementById('start-btn');
        const startOverlay = document.getElementById('start-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const finishBtn = document.getElementById('finish-btn');
        const quitBtn = document.getElementById('quit-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettings = document.getElementById('close-settings');
        const settingsPanel = document.getElementById('settings-panel');
        const historyContainer = document.getElementById('history-container');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        const speedValLabel = document.getElementById('speed-val');
        const sizeValLabel = document.getElementById('size-val');
        const freqValLabel = document.getElementById('freq-val');

        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');
        const freqSlider = document.getElementById('freq-slider');
        const guideLinesCheck = document.getElementById('guide-lines');

        // 遊戲狀態
        let gameRunning = false;
        let isPaused = false;
        let score = 0;
        let misses = 0;
        let targets = [];
        let lastTargetTime = 0;
        let mouseX = 0;
        let animationId = null;
        let totalElapsedSeconds = 0;
        let sessionStartTime = 0;

        // 歷史紀錄
        let history = [];

        // 遊戲參數 (更新為您要求的初始值)
        let config = {
            fallDurationSeconds: 8,
            targetSpeed: 2,
            playerWidth: 300,
            spawnFrequency: 3000,
            showGuides: true
        };

        // 適應性畫布縮放
        function resizeCanvas() {
            const padding = 16;
            const availableWidth = mainElement.clientWidth - (padding * 2);
            const availableHeight = mainElement.clientHeight - (padding * 2);

            canvas.width = Math.min(availableWidth, 800);
            canvas.height = Math.min(availableHeight, 600);
            
            updateConfig(); 
            if (!gameRunning) mouseX = canvas.width / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        canvas.addEventListener('mousemove', (e) => {
            if (isPaused || !gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        startBtn.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            resetSession();
            gameRunning = true;
            isPaused = false;
            sessionStartTime = performance.now();
            lastTargetTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        pauseBtn.addEventListener('click', () => {
            if (gameRunning && !isPaused) togglePause();
        });

        resumeBtn.addEventListener('click', togglePause);

        finishBtn.addEventListener('click', () => {
            saveToHistory();
            returnToMenu();
        });

        quitBtn.addEventListener('click', () => {
            if(confirm("確定要直接放棄本次訓練嗎？數據將不會被記錄。")) {
                returnToMenu();
            }
        });

        function returnToMenu() {
            isPaused = false;
            gameRunning = false;
            pauseOverlay.classList.add('hidden');
            startOverlay.style.display = 'flex';
            renderHistory();
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                const currentElapsed = Math.floor((performance.now() - sessionStartTime) / 1000);
                totalElapsedSeconds += currentElapsed;
                
                document.getElementById('pause-score').innerText = score;
                document.getElementById('pause-miss').innerText = misses;
                document.getElementById('training-duration').innerText = formatTime(totalElapsedSeconds);
                
                const total = score + misses;
                const rate = total === 0 ? 100 : Math.round((score / total) * 100);
                document.getElementById('accuracy-rate').innerText = `${rate}%`;
                
                pauseOverlay.classList.remove('hidden');
                cancelAnimationFrame(animationId);
            } else {
                sessionStartTime = performance.now();
                pauseOverlay.classList.add('hidden');
                lastTargetTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function formatTime(s) {
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
        });

        closeSettings.addEventListener('click', () => {
            settingsPanel.classList.add('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("確定要清除所有訓練歷史紀錄嗎？")) {
                history = [];
                renderHistory();
            }
        });

        function resetSession() {
            score = 0;
            misses = 0;
            targets = [];
            totalElapsedSeconds = 0;
            updateStats();
        }

        function saveToHistory() {
            const total = score + misses;
            if (total === 0 && totalElapsedSeconds < 2) return;

            const record = {
                timestamp: new Date().toLocaleString(),
                score: score,
                misses: misses,
                duration: formatTime(totalElapsedSeconds),
                accuracy: total === 0 ? 0 : Math.round((score / total) * 100)
            };
            history.unshift(record);
        }

        function renderHistory() {
            if (history.length === 0) {
                historyContainer.innerHTML = '<p class="text-gray-400 text-center py-10">尚無紀錄</p>';
                return;
            }

            historyContainer.innerHTML = history.map((item) => `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div class="flex-grow">
                        <p class="text-[10px] text-gray-400 font-mono">${item.timestamp}</p>
                        <div class="flex gap-3 items-baseline">
                            <span class="text-lg font-bold text-blue-600">${item.score} <small class="text-[10px] text-gray-400">接住</small></span>
                            <span class="text-sm font-medium text-gray-500">${item.accuracy}%</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded">${item.duration}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateConfig() {
            config.fallDurationSeconds = parseFloat(speedSlider.value);
            // 速度 = 高度 / (秒數 * 60幀)
            config.targetSpeed = canvas.height / (config.fallDurationSeconds * 60);
            config.playerWidth = parseInt(sizeSlider.value);
            config.spawnFrequency = parseFloat(freqSlider.value) * 1000;
            config.showGuides = guideLinesCheck.checked;

            speedValLabel.innerText = config.fallDurationSeconds.toFixed(1) + " 秒";
            sizeValLabel.innerText = config.playerWidth + " px";
            freqValLabel.innerText = (config.spawnFrequency / 1000).toFixed(1) + " 秒";
        }

        [speedSlider, sizeSlider, freqSlider, guideLinesCheck].forEach(el => {
            el.addEventListener('input', updateConfig);
        });

        function updateStats() {
            scoreDisplay.innerText = score;
            missDisplay.innerText = misses;
        }

        function createTarget() {
            const sides = [0.2, 0.5, 0.8];
            const x = canvas.width * sides[Math.floor(Math.random() * sides.length)];
            targets.push({ x: x, y: -30, radius: 18, color: '#3B82F6' });
        }

        function drawPlayer() {
            const playerHeight = 16;
            const playerY = canvas.height - 40;
            
            if (mouseX < config.playerWidth / 2) mouseX = config.playerWidth / 2;
            if (mouseX > canvas.width - config.playerWidth / 2) mouseX = canvas.width - config.playerWidth / 2;

            const x = mouseX - config.playerWidth / 2;

            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(59, 130, 246, 0.4)';
            ctx.fillStyle = '#3B82F6';
            ctx.beginPath();
            ctx.roundRect(x, playerY, config.playerWidth, playerHeight, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(mouseX, playerY);
            ctx.lineTo(mouseX, 0);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGuides() {
            if (!config.showGuides) return;
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 2;
            [0.2, 0.5, 0.8].forEach(p => {
                ctx.beginPath();
                ctx.setLineDash([2, 4]);
                ctx.moveTo(canvas.width * p, 0);
                ctx.lineTo(canvas.width * p, canvas.height);
                ctx.stroke();
            });
            ctx.setLineDash([]);
        }

        function gameLoop(timestamp) {
            if (!gameRunning || isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGuides();

            if (timestamp - lastTargetTime > config.spawnFrequency) {
                createTarget();
                lastTargetTime = timestamp;
            }

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                t.y += config.targetSpeed;

                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(t.x-5, t.y-5, 2, t.x, t.y, t.radius);
                gradient.addColorStop(0, '#60a5fa');
                gradient.addColorStop(1, '#2563eb');
                ctx.fillStyle = gradient;
                ctx.fill();

                const playerY = canvas.height - 40;
                
                if (t.y + t.radius > playerY && t.y - t.radius < playerY + 16) {
                    if (t.x > mouseX - config.playerWidth / 2 - 5 && t.x < mouseX + config.playerWidth / 2 + 5) {
                        score++;
                        targets.splice(i, 1);
                        updateStats();
                        continue;
                    }
                }

                if (t.y > canvas.height + 30) {
                    misses++;
                    targets.splice(i, 1);
                    updateStats();
                }
            }

            drawPlayer();
            animationId = requestAnimationFrame(gameLoop);
        }

        updateConfig();
    </script>
</body>
</html>
