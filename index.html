<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中風復健：左右控制訓練</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        #game-canvas {
            cursor: none;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        input[type=range] {
            height: 8px;
            border-radius: 5px;
            background: #e2e8f0;
            outline: none;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .mode-active {
            border: 2px solid #3B82F6;
            background-color: #EFF6FF;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- 頂部資訊欄 -->
    <header id="game-header" class="p-4 flex justify-between items-center bg-white shadow-sm z-10">
        <div class="flex items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-blue-600">左右平衡訓練</h1>
                <p id="mode-indicator" class="text-gray-400 text-[10px] md:text-xs">目前模式：碼表計時</p>
            </div>
            <!-- 目標進度顯示 (僅在有目標時顯示) -->
            <div id="target-progress-ui" class="hidden flex-col px-4 py-1 bg-blue-600 rounded-lg text-white">
                <span class="text-[10px] font-bold opacity-80">訓練進度</span>
                <span id="progress-text" class="text-sm font-bold font-mono">0 / 0</span>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <div class="flex flex-col items-center px-4 py-1 bg-blue-50 rounded-lg border border-blue-100">
                <span class="text-[10px] text-blue-400 font-bold">已訓練時間</span>
                <span id="timer-display" class="text-lg md:text-xl font-mono font-bold text-blue-700">00:00</span>
            </div>

            <div class="flex gap-2 md:gap-4 text-sm md:text-xl mr-2">
                <div class="font-semibold text-green-600 px-2 md:px-3 py-1 bg-green-50 rounded-lg">成功: <span id="score-display">0</span></div>
                <div class="font-semibold text-red-500 px-2 md:px-3 py-1 bg-red-50 rounded-lg">漏掉: <span id="miss-display">0</span></div>
            </div>
            
            <button id="pause-btn" class="px-3 py-2 bg-amber-500 text-white text-sm font-bold rounded-lg hover:bg-amber-600 transition">
                暫停
            </button>

            <button id="settings-btn" class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0" />
                </svg>
            </button>
        </div>
    </header>

    <!-- 遊戲主區域 -->
    <main id="game-main" class="flex-grow flex items-center justify-center p-2 md:p-4 relative overflow-hidden">
        <canvas id="game-canvas"></canvas>

        <!-- 開始畫面 -->
        <div id="start-overlay" class="absolute inset-0 bg-white bg-opacity-95 flex flex-col items-center justify-center z-20 p-4">
            <div class="flex flex-col lg:flex-row gap-6 max-w-6xl w-full h-full lg:h-auto overflow-y-auto lg:overflow-visible p-2">
                <!-- 左側：開始介紹 -->
                <div class="flex-1 text-center lg:text-left p-6 md:p-8 bg-white rounded-3xl shadow-xl border border-gray-100">
                    <div class="mb-4 text-5xl">🎯</div>
                    <h2 class="text-2xl md:text-3xl font-bold mb-4">訓練計畫準備</h2>
                    <p class="text-gray-600 mb-6 text-sm md:text-lg leading-relaxed">
                        水平移動滑鼠，盡力接住所有藍色球體。您可以在設定中切換不同的訓練模式。
                    </p>
                    <button id="start-btn" class="w-full py-4 bg-blue-600 text-white text-xl font-bold rounded-xl hover:bg-blue-700 transition shadow-lg active:scale-95 mb-4">
                        開始新訓練
                    </button>
                </div>

                <!-- 右側：歷史紀錄 -->
                <div class="flex-1 p-6 md:p-8 bg-gray-50 rounded-3xl shadow-inner border border-gray-200 flex flex-col max-h-[400px] lg:max-h-[500px]">
                    <h3 class="text-lg font-bold mb-4 text-gray-700 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        訓練歷史紀錄
                    </h3>
                    <div id="history-container" class="history-list overflow-y-auto space-y-3 pr-2">
                        <p class="text-gray-400 text-center py-10">尚無紀錄</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 暫停/成績詳細畫面 -->
        <div id="pause-overlay" class="hidden absolute inset-0 bg-blue-900 bg-opacity-40 backdrop-blur-sm flex flex-col items-center justify-center z-40 p-4">
            <div class="text-center p-6 md:p-8 bg-white rounded-3xl shadow-2xl max-w-md w-full animate-in fade-in zoom-in duration-300">
                <h2 id="pause-title" class="text-2xl font-bold mb-6 text-gray-800">訓練暫停中</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                        <p class="text-xs text-green-600 font-medium">成功接住</p>
                        <p id="pause-score" class="text-2xl md:text-3xl font-bold text-green-700">0</p>
                    </div>
                    <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                        <p class="text-xs text-red-600 font-medium">漏掉次數</p>
                        <p id="pause-miss" class="text-2xl md:text-3xl font-bold text-red-700">0</p>
                    </div>
                </div>

                <div class="space-y-2 mb-6 text-left">
                    <div class="flex justify-between items-center p-3 bg-blue-50 rounded-xl">
                        <span class="text-blue-700 text-sm font-medium">成功率</span>
                        <span id="accuracy-rate" class="text-lg font-bold text-blue-800">100%</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl">
                        <span class="text-gray-600 text-sm font-medium">訓練時長</span>
                        <span id="training-duration" class="text-lg font-bold text-gray-800">00:00</span>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="resume-btn" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-md">
                        繼續訓練
                    </button>
                    <button id="finish-btn" class="w-full py-3 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition shadow-md">
                        儲存並結束這回合
                    </button>
                    <button id="quit-btn" class="w-full py-3 bg-white border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:bg-gray-50 transition">
                        放棄並回到主選單
                    </button>
                </div>
            </div>
        </div>

        <!-- 設定側欄 -->
        <div id="settings-panel" class="hidden absolute right-4 top-4 bottom-4 w-72 md:w-80 p-6 rounded-2xl shadow-2xl z-50 flex flex-col control-panel border border-white">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">訓練計畫設定</h3>
                <button id="close-settings" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>

            <div class="space-y-5 overflow-y-auto pr-2 flex-grow">
                <!-- 模式切換 -->
                <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                    <label class="block text-sm font-bold text-gray-700 mb-3">訓練模式</label>
                    <select id="mode-select" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="stopwatch">碼表計時 (無限制)</option>
                        <option value="targetCount">指定接住數量模式</option>
                        <option value="targetTime">目標時間模式</option>
                    </select>
                </div>

                <!-- 目標數量設定 (條件顯示) -->
                <div id="target-count-container" class="hidden bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-blue-700">目標接住數量</label>
                        <span id="target-count-val" class="px-2 py-1 bg-blue-600 text-white text-xs font-black rounded">50 個</span>
                    </div>
                    <input type="range" id="target-count-slider" min="10" max="200" step="10" value="50" class="w-full cursor-pointer">
                </div>

                <!-- 目標時間設定 (條件顯示) -->
                <div id="target-time-container" class="hidden bg-amber-50 p-3 rounded-xl border border-amber-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-amber-700">目標訓練時間</label>
                        <span id="target-time-val" class="px-2 py-1 bg-amber-600 text-white text-xs font-black rounded">5 分鐘</span>
                    </div>
                    <input type="range" id="target-time-slider" min="1" max="30" step="1" value="5" class="w-full cursor-pointer">
                </div>

                <hr class="border-gray-100">

                <!-- 基礎參數 -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-500 uppercase">球體下落時間</label>
                        <span id="speed-val" class="text-xs font-black text-blue-600">8.0 秒</span>
                    </div>
                    <input type="range" id="speed-slider" min="1" max="15" step="0.5" value="8" class="w-full cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-500 uppercase">收集器寬度</label>
                        <span id="size-val" class="text-xs font-black text-blue-600">300 px</span>
                    </div>
                    <input type="range" id="size-slider" min="40" max="500" step="10" value="300" class="w-full cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-500 uppercase">生成間隔</label>
                        <span id="freq-val" class="text-xs font-black text-blue-600">3.0 秒</span>
                    </div>
                    <input type="range" id="freq-slider" min="0.5" max="8" step="0.5" value="3" class="w-full cursor-pointer">
                </div>

                <label class="flex items-center space-x-3 cursor-pointer p-2 bg-gray-50 rounded-lg">
                    <input type="checkbox" id="guide-lines" checked class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-xs font-bold text-gray-600">顯示落點引導線</span>
                </label>
            </div>

            <div class="mt-4 pt-4 border-t">
                <button id="reset-history-btn" class="w-full py-2 border border-red-200 text-red-400 text-xs font-bold rounded-lg hover:bg-red-50 transition">
                    清除歷史紀錄
                </button>
            </div>
        </div>
    </main>

    <footer id="game-footer" class="p-2 text-center text-gray-400 text-[10px] md:text-xs bg-white border-t">
        系統建議：初學者建議從 300px 寬度及 8 秒下落速度開始。感到疲勞請隨時休息。
    </footer>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const mainElement = document.getElementById('game-main');
        const scoreDisplay = document.getElementById('score-display');
        const missDisplay = document.getElementById('miss-display');
        const timerDisplay = document.getElementById('timer-display');
        const modeIndicator = document.getElementById('mode-indicator');
        const progressUI = document.getElementById('target-progress-ui');
        const progressText = document.getElementById('progress-text');
        
        const startBtn = document.getElementById('start-btn');
        const startOverlay = document.getElementById('start-overlay');
        const pauseOverlay = document.getElementById('pause-overlay');
        const pauseTitle = document.getElementById('pause-title');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const finishBtn = document.getElementById('finish-btn');
        const quitBtn = document.getElementById('quit-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettings = document.getElementById('close-settings');
        const settingsPanel = document.getElementById('settings-panel');
        const historyContainer = document.getElementById('history-container');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        // 設定控制項
        const modeSelect = document.getElementById('mode-select');
        const targetCountContainer = document.getElementById('target-count-container');
        const targetTimeContainer = document.getElementById('target-time-container');
        
        const speedSlider = document.getElementById('speed-slider');
        const sizeSlider = document.getElementById('size-slider');
        const freqSlider = document.getElementById('freq-slider');
        const targetCountSlider = document.getElementById('target-count-slider');
        const targetTimeSlider = document.getElementById('target-time-slider');
        const guideLinesCheck = document.getElementById('guide-lines');

        const speedValLabel = document.getElementById('speed-val');
        const sizeValLabel = document.getElementById('size-val');
        const freqValLabel = document.getElementById('freq-val');
        const targetCountValLabel = document.getElementById('target-count-val');
        const targetTimeValLabel = document.getElementById('target-time-val');

        // 遊戲狀態
        let gameRunning = false;
        let isPaused = false;
        let score = 0;
        let misses = 0;
        let targets = [];
        let lastTargetTime = 0;
        let mouseX = 0;
        let animationId = null;
        let totalElapsedSeconds = 0;
        let sessionStartTime = 0;

        // 歷史紀錄
        let history = [];

        // 遊戲參數
        let config = {
            mode: 'stopwatch', // stopwatch, targetCount, targetTime
            targetCount: 50,
            targetTimeMinutes: 5,
            fallDurationSeconds: 8,
            targetSpeed: 2,
            playerWidth: 300,
            spawnFrequency: 3000,
            showGuides: true
        };

        function resizeCanvas() {
            const padding = 16;
            const availableWidth = mainElement.clientWidth - (padding * 2);
            const availableHeight = mainElement.clientHeight - (padding * 2);
            canvas.width = Math.min(availableWidth, 800);
            canvas.height = Math.min(availableHeight, 600);
            updateConfig(); 
            if (!gameRunning) mouseX = canvas.width / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        canvas.addEventListener('mousemove', (e) => {
            if (isPaused || !gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        startBtn.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            resetSession();
            gameRunning = true;
            isPaused = false;
            sessionStartTime = performance.now();
            lastTargetTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        pauseBtn.addEventListener('click', () => {
            if (gameRunning && !isPaused) togglePause();
        });

        resumeBtn.addEventListener('click', togglePause);

        finishBtn.addEventListener('click', () => {
            saveToHistory();
            returnToMenu();
        });

        quitBtn.addEventListener('click', () => {
            if(confirm("確定要放棄目前進度並回到主選單嗎？")) {
                returnToMenu();
            }
        });

        function returnToMenu() {
            isPaused = false;
            gameRunning = false;
            pauseOverlay.classList.add('hidden');
            startOverlay.style.display = 'flex';
            renderHistory();
        }

        function togglePause(isAutoFinish = false) {
            if (!gameRunning && !isAutoFinish) return;

            isPaused = !isPaused;
            if (isPaused) {
                const currentElapsed = (performance.now() - sessionStartTime) / 1000;
                totalElapsedSeconds += currentElapsed;
                
                pauseTitle.innerText = isAutoFinish ? "恭喜達成目標！" : "訓練暫停中";
                document.getElementById('pause-score').innerText = score;
                document.getElementById('pause-miss').innerText = misses;
                document.getElementById('training-duration').innerText = formatTime(Math.floor(totalElapsedSeconds));
                
                const total = score + misses;
                const rate = total === 0 ? 100 : Math.round((score / total) * 100);
                document.getElementById('accuracy-rate').innerText = `${rate}%`;
                
                resumeBtn.style.display = isAutoFinish ? "none" : "block";
                pauseOverlay.classList.remove('hidden');
                cancelAnimationFrame(animationId);
            } else {
                sessionStartTime = performance.now();
                pauseOverlay.classList.add('hidden');
                lastTargetTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        function formatTime(s) {
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('hidden');
        });

        closeSettings.addEventListener('click', () => {
            settingsPanel.classList.add('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("確定要清除所有訓練歷史紀錄嗎？")) {
                history = [];
                renderHistory();
            }
        });

        function resetSession() {
            score = 0;
            misses = 0;
            targets = [];
            totalElapsedSeconds = 0;
            timerDisplay.innerText = "00:00";
            updateStats();
            updateProgressDisplay();
        }

        function saveToHistory() {
            const total = score + misses;
            if (total === 0 && totalElapsedSeconds < 1) return;

            let modeName = "計時碼表";
            if(config.mode === 'targetCount') modeName = `數量目標(${config.targetCount})`;
            if(config.mode === 'targetTime') modeName = `時間目標(${config.targetTimeMinutes}分)`;

            const record = {
                timestamp: new Date().toLocaleString(),
                mode: modeName,
                score: score,
                misses: misses,
                duration: formatTime(Math.floor(totalElapsedSeconds)),
                accuracy: total === 0 ? 0 : Math.round((score / total) * 100)
            };
            history.unshift(record);
        }

        function renderHistory() {
            if (history.length === 0) {
                historyContainer.innerHTML = '<p class="text-gray-400 text-center py-10 text-xs">尚無紀錄</p>';
                return;
            }

            historyContainer.innerHTML = history.map((item) => `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[9px] text-blue-500 font-bold bg-blue-50 px-1.5 py-0.5 rounded">${item.mode}</span>
                        <span class="text-[9px] text-gray-300 font-mono">${item.timestamp}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex gap-3 items-baseline">
                            <span class="text-lg font-bold text-gray-700">${item.score} <small class="text-[10px] text-gray-400">接住</small></span>
                            <span class="text-xs font-medium text-green-500">${item.accuracy}% 成功</span>
                        </div>
                        <p class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded">${item.duration}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateConfig() {
            config.mode = modeSelect.value;
            config.fallDurationSeconds = parseFloat(speedSlider.value);
            config.targetSpeed = canvas.height / (config.fallDurationSeconds * 60);
            config.playerWidth = parseInt(sizeSlider.value);
            config.spawnFrequency = parseFloat(freqSlider.value) * 1000;
            config.showGuides = guideLinesCheck.checked;
            config.targetCount = parseInt(targetCountSlider.value);
            config.targetTimeMinutes = parseInt(targetTimeSlider.value);

            // 更新標籤
            speedValLabel.innerText = config.fallDurationSeconds.toFixed(1) + " 秒";
            sizeValLabel.innerText = config.playerWidth + " px";
            freqValLabel.innerText = (config.spawnFrequency / 1000).toFixed(1) + " 秒";
            targetCountValLabel.innerText = config.targetCount + " 個";
            targetTimeValLabel.innerText = config.targetTimeMinutes + " 分鐘";

            // 模式對應 UI 開關
            targetCountContainer.classList.toggle('hidden', config.mode !== 'targetCount');
            targetTimeContainer.classList.toggle('hidden', config.mode !== 'targetTime');
            
            let modeName = "計時碼表";
            if(config.mode === 'targetCount') modeName = `目標數量：${config.targetCount} 個`;
            if(config.mode === 'targetTime') modeName = `目標時間：${config.targetTimeMinutes} 分鐘`;
            modeIndicator.innerText = "目前模式：" + modeName;

            updateProgressDisplay();
        }

        function updateProgressDisplay() {
            if (config.mode === 'stopwatch') {
                progressUI.classList.add('hidden');
                return;
            }
            progressUI.classList.remove('hidden');
            if (config.mode === 'targetCount') {
                progressText.innerText = `${score} / ${config.targetCount} 球`;
            } else {
                // 時間進度在遊戲迴圈更新
            }
        }

        [modeSelect, speedSlider, sizeSlider, freqSlider, targetCountSlider, targetTimeSlider, guideLinesCheck].forEach(el => {
            el.addEventListener('input', updateConfig);
        });

        function updateStats() {
            scoreDisplay.innerText = score;
            missDisplay.innerText = misses;
            updateProgressDisplay();
        }

        function createTarget() {
            const sides = [0.2, 0.5, 0.8];
            const x = canvas.width * sides[Math.floor(Math.random() * sides.length)];
            targets.push({ x: x, y: -30, radius: 18, color: '#3B82F6' });
        }

        function drawPlayer() {
            const playerHeight = 16;
            const playerY = canvas.height - 40;
            if (mouseX < config.playerWidth / 2) mouseX = config.playerWidth / 2;
            if (mouseX > canvas.width - config.playerWidth / 2) mouseX = canvas.width - config.playerWidth / 2;
            const x = mouseX - config.playerWidth / 2;

            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(59, 130, 246, 0.4)';
            ctx.fillStyle = '#3B82F6';
            ctx.beginPath();
            ctx.roundRect(x, playerY, config.playerWidth, playerHeight, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(59, 130, 246, 0.15)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(mouseX, playerY);
            ctx.lineTo(mouseX, 0);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGuides() {
            if (!config.showGuides) return;
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 2;
            [0.2, 0.5, 0.8].forEach(p => {
                ctx.beginPath();
                ctx.setLineDash([2, 4]);
                ctx.moveTo(canvas.width * p, 0);
                ctx.lineTo(canvas.width * p, canvas.height);
                ctx.stroke();
            });
            ctx.setLineDash([]);
        }

        function gameLoop(timestamp) {
            if (!gameRunning || isPaused) return;

            // 時間計算
            const currentSessionElapsed = (performance.now() - sessionStartTime) / 1000;
            const totalSec = totalElapsedSeconds + currentSessionElapsed;
            timerDisplay.innerText = formatTime(Math.floor(totalSec));

            // 目標時間檢查
            if (config.mode === 'targetTime') {
                const targetSec = config.targetTimeMinutes * 60;
                progressText.innerText = `${formatTime(Math.floor(totalSec))} / ${formatTime(targetSec)}`;
                if (totalSec >= targetSec) {
                    togglePause(true);
                    return;
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGuides();

            if (timestamp - lastTargetTime > config.spawnFrequency) {
                createTarget();
                lastTargetTime = timestamp;
            }

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                t.y += config.targetSpeed;

                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(t.x-5, t.y-5, 2, t.x, t.y, t.radius);
                gradient.addColorStop(0, '#60a5fa');
                gradient.addColorStop(1, '#2563eb');
                ctx.fillStyle = gradient;
                ctx.fill();

                const playerY = canvas.height - 40;
                if (t.y + t.radius > playerY && t.y - t.radius < playerY + 16) {
                    if (t.x > mouseX - config.playerWidth / 2 - 5 && t.x < mouseX + config.playerWidth / 2 + 5) {
                        score++;
                        targets.splice(i, 1);
                        updateStats();
                        
                        // 目標數量檢查
                        if (config.mode === 'targetCount' && score >= config.targetCount) {
                            togglePause(true);
                            return;
                        }
                        continue;
                    }
                }
                if (t.y > canvas.height + 30) {
                    misses++;
                    targets.splice(i, 1);
                    updateStats();
                }
            }

            drawPlayer();
            animationId = requestAnimationFrame(gameLoop);
        }

        updateConfig();
        renderHistory();
    </script>
</body>
</html>
